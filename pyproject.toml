[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "baja-sponsorship-ai"
version = "0.1.0"
description = "BAJA UEA sponsorship research and evidence foundation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[project.scripts]
baja-research = "baja_sponsorship.research.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
research-openai = ["openai>=1.90,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
